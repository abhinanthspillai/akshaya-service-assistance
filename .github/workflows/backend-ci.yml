name: Backend CI
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akshaya
          POSTGRES_PASSWORD: akshaya
          POSTGRES_DB: akshaya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akshaya -d akshaya_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://akshaya:akshaya@localhost:5432/akshaya_test
      JWT_SECRET_KEY: ci-only-not-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format check
        working-directory: backend
        run: ruff format --check .
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type check
        working-directory: backend
        run: mypy app tests
      - name: Test
        working-directory: backend
        run: pytest
      - name: Migration upgrade
        working-directory: backend
        run: alembic upgrade head
      - name: Dependency audit
        working-directory: backend
        run: pip-audit
