[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "akshaya-service-assistance-backend"
version = "0.1.0"
description = "FastAPI backend for the Akshaya MCA service-assistance platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "pwdlib[argon2]>=0.2.0,<1.0",
    "PyJWT>=2.8.0,<3.0",
    "python-multipart",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
